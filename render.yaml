# Render Blueprint (Infrastructure as Code) para o FutCaixa.
#
# Publica a aplicação Next.js (front + back no mesmo serviço) como um Web
# Service Node.
#
# SOBRE OS CRONS: os Cron Jobs do Render NÃO têm plano gratuito (só web services
# têm free tier) — por isso NÃO são declarados aqui. No plano Free, agende os
# dois crons com um serviço externo gratuito (cron-job.org, Upstash QStash etc.)
# fazendo um GET nas rotas abaixo com o header do CRON_SECRET:
#   GET $APP_URL/api/cron/gerar-mensalidades
#   GET $APP_URL/api/cron/gerar-recorrentes
#   Header: Authorization: Bearer <CRON_SECRET>
# Ver docs/deploy-render.md. (Se optar por um plano pago, dá para adicionar os
# serviços `type: cron` aqui com `plan: starter`.)
#
# Como usar:
#   1. No Render: New > Blueprint > conecte o repo github.com/edipo-dados/futcaixa.
#   2. O Render lê este arquivo e cria o Web Service.
#   3. Preencha as env vars marcadas com `sync: false` (valores secretos) no
#      painel: NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
#      SUPABASE_SERVICE_ROLE_KEY, CRON_SECRET.
#
# Observação (Free): o web service "dorme" após 15 min sem tráfego; o primeiro
# acesso após ocioso sofre cold start (~1 min). Para eliminar, troque `plan:
# free` por um plano pago.

services:
  # ── Aplicação Next.js (SSR + Server Actions + API) ──────────────────────
  - type: web
    name: futcaixa
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Segredos: preencher no painel do Render (não versionar valores).
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
